<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>مناوب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E8EEEC; --ink:#10282B; --muted:#56696A; --line:#D3DDDA;
  --accent:#0E7C66; --accent-soft:#D5EEE7; --on-accent:#FFFFFF;
  --we:#0E7C66; --we-soft:#DCEFE9; --wd:#3A5BA0; --wd-soft:#E1E8F6; --ot:#A86A12; --ot-soft:#F6EAD6;
  --danger:#B23A55; --danger-soft:#F7E0E6; --warn:#A86A12; --comp:#5B4BA8; --comp-soft:#E8E5F7;
  --shadow:0 1px 2px rgba(16,40,43,.06),0 6px 24px rgba(16,40,43,.06);
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif; --f-disp:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0C1618; --surface:#132226; --surface-2:#1A2D31; --ink:#E2EDEB; --muted:#93A8A6; --line:#2A3F43;
  --accent:#3CB397; --accent-soft:#16372F; --on-accent:#08201A;
  --we:#3CB397; --we-soft:#15342D; --wd:#8CA8E4; --wd-soft:#1C2A45; --ot:#E2A64C; --ot-soft:#3A2B12;
  --danger:#E57C93; --danger-soft:#3D1C25; --warn:#E2A64C; --comp:#AFA3F0; --comp-soft:#282345;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1618; --surface:#132226; --surface-2:#1A2D31; --ink:#E2EDEB; --muted:#93A8A6; --line:#2A3F43;
  --accent:#3CB397; --accent-soft:#16372F; --on-accent:#08201A;
  --we:#3CB397; --we-soft:#15342D; --wd:#8CA8E4; --wd-soft:#1C2A45; --ot:#E2A64C; --ot-soft:#3A2B12;
  --danger:#E57C93; --danger-soft:#3D1C25; --warn:#E2A64C; --comp:#AFA3F0; --comp-soft:#282345;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.6}
#app{max-width:1400px;margin:0 auto;padding-inline:16px;padding-block:14px 60px}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;line-height:1.3}
h2{font-size:1.25rem;font-weight:600} h3{font-size:1.02rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* header */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:6px 14px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:18px}
.brand h1{font-size:1.35rem;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:.8rem;margin-top:-2px}
.status{font-size:.8rem;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.status.ok{background:var(--accent-soft);color:var(--accent)}
.status.sample{background:var(--ot-soft);color:var(--ot)}
.monthpick{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.monthpick button{border:0;background:transparent;width:32px;height:32px;border-radius:8px;font-size:18px}
.monthpick button:hover{background:var(--surface-2)}
.monthpick strong{font-family:var(--f-disp);font-weight:600;min-width:130px;text-align:center}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:10px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--ot-soft);color:var(--ink);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.banner b{color:var(--ot)}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:9px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;min-height:150px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
label.f > *{color:var(--ink)}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.chk:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .v{font-family:var(--f-disp);font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi .l{color:var(--muted);font-size:.82rem}
.kpi.bad .v{color:var(--danger)} .kpi.warn .v{color:var(--warn)} .kpi.good .v{color:var(--accent)}
.hero{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.hero h2{font-size:1.5rem}
.list{display:flex;flex-direction:column}
.list .it{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.list .it:last-child{border-bottom:0}
.list .it time{color:var(--muted);font-size:.8rem;white-space:nowrap}
.pill{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.we{background:var(--we-soft);color:var(--we)} .pill.wd{background:var(--wd-soft);color:var(--wd)} .pill.ot{background:var(--ot-soft);color:var(--ot)}
.pill.sick{background:var(--danger-soft);color:var(--danger)} .pill.comp{background:var(--comp-soft);color:var(--comp)}
.dayboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.dayboard .blk{border:1px solid var(--line);border-radius:10px;padding:10px;border-top:3px solid var(--line)}
.dayboard .blk.we{border-top-color:var(--we)} .dayboard .blk.wd{border-top-color:var(--wd)} .dayboard .blk.ot{border-top-color:var(--ot)}
.dayboard .blk h4{margin:0 0 4px;font-size:.88rem;font-weight:600}
.dayboard .blk .t{font-size:.78rem;color:var(--muted)}
.fair{display:flex;gap:18px;flex-wrap:wrap}
.fair div{min-width:120px}
.fair b{font-family:var(--f-disp);font-size:1.15rem;font-variant-numeric:tabular-nums}

/* schedule */
.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;font-weight:500}
.subtabs button[aria-selected="true"].we{background:var(--we);border-color:var(--we);color:var(--on-accent)}
.subtabs button[aria-selected="true"].wd{background:var(--wd);border-color:var(--wd);color:var(--surface)}
.subtabs button[aria-selected="true"].ot{background:var(--ot);border-color:var(--ot);color:var(--surface)}
.sheet-title{text-align:center;font-family:var(--f-disp);font-weight:600;font-size:1.05rem;padding:10px;border-radius:10px;background:var(--surface-2);margin-block:12px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.sched{border-collapse:collapse;width:100%;min-width:900px;font-size:.84rem}
table.sched th,table.sched td{border:1px solid var(--line);padding:6px 8px;vertical-align:top;text-align:right}
table.sched thead th{background:var(--surface-2);font-weight:600;text-align:center;position:sticky;top:0}
table.sched thead tr:first-child th{font-family:var(--f-disp)}
table.sched th.date{position:sticky;right:0;background:var(--surface-2);z-index:2;min-width:84px;text-align:center}
table.sched tbody th.date{background:var(--surface)}
table.sched th.date b{display:block;font-family:var(--f-disp)}
table.sched th.date span{font-variant-numeric:tabular-nums;color:var(--muted)}
table.sched tr.weekend th.date b{color:var(--we)}
table.sched tr.holiday th.date b{color:var(--danger)}
.nm{display:block;border:0;background:transparent;padding:1px 4px;margin:0 -4px;border-radius:5px;text-align:right;white-space:nowrap;width:calc(100% + 8px)}
button.nm:hover{background:var(--surface-2)}
.nm .pre{color:var(--muted);font-size:.78rem;margin-left:3px}
.nm.rep{box-shadow:inset -3px 0 0 var(--ot);background:var(--ot-soft)}
.nm.comp{box-shadow:inset -3px 0 0 var(--comp);background:var(--comp-soft)}
.nm.pin{box-shadow:inset -3px 0 0 var(--wd);background:var(--wd-soft)}
.nm.pin .pre::before{content:"📌";font-size:.7rem;margin-left:2px}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.full i{background:var(--warn)}
.pill.pin{background:var(--wd-soft);color:var(--wd)}
.nm.w::after{content:" ⚠";color:var(--warn);font-size:.75rem}
.nm.hl{outline:2px solid var(--accent);background:var(--accent-soft)}
.nm.vac{color:var(--danger);font-style:normal;font-size:.8rem;border:1px dashed var(--danger);text-align:center;margin-top:2px}
td.na{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 7px);color:var(--muted);text-align:center!important;vertical-align:middle!important}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}

/* staff table */
table.data{border-collapse:collapse;width:100%;font-size:.88rem}
table.data th,table.data td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}
table.data th{color:var(--muted);font-weight:500;font-size:.8rem;background:var(--surface-2)}
table.data tr.off td{opacity:.5}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:.72rem;padding:1px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.role{font-size:.75rem;font-weight:600;padding:1px 8px;border-radius:6px;white-space:nowrap}
.role.ph{background:var(--we-soft);color:var(--we)} .role.tech{background:var(--wd-soft);color:var(--wd)} .role.dr{background:var(--comp-soft);color:var(--comp)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(8,20,22,.45);display:grid;place-items:center;padding:16px;z-index:50}
#modal .box{background:var(--surface);color:var(--ink);border-radius:16px;width:min(620px,100%);max-height:88vh;overflow:auto;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
#modal .box.wide{width:min(900px,100%)}
#modal .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-start}
.cand{display:flex;flex-direction:column;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.cand button{display:flex;gap:10px;align-items:center;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:8px 12px;text-align:right}
.cand button:hover{background:var(--surface-2)}
.cand button:last-child{border-bottom:0}
.cand small{color:var(--muted);font-variant-numeric:tabular-nums}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:50%;transform:translateX(50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:60;font-size:.9rem;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
@media (max-width:600px){ .brand small{display:none} .monthpick strong{min-width:100px} .hero h2{font-size:1.2rem} }
@media (prefers-reduced-motion:no-preference){ .btn,.nm,.tabs button{transition:background .15s,border-color .15s,color .15s} }
</style></head><body>

<div id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand"><div class="mark">م</div><div><h1>مناوب</h1><small>جداول الخفارات والعمل الإضافي لقسم الصيدلة</small></div></div>
    <div class="spacer"></div>
    <span id="status" class="status">جارٍ التحميل…</span>
    <div class="monthpick"><button id="mPrev" aria-label="الشهر السابق">›</button><strong id="mLabel"></strong><button id="mNext" aria-label="الشهر التالي">‹</button></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button data-tab="dash" role="tab">لوحة التحكم</button>
    <button data-tab="sched" role="tab">الجداول</button>
    <button data-tab="staff" role="tab">الموظفون</button>
    <button data-tab="leaves" role="tab">الإجازات والطوارئ</button>
    <button data-tab="prefs" role="tab">الرغبات والتثبيت</button>
    <button data-tab="settings" role="tab">الإعدادات</button>
  </nav>
  <div id="banner"></div>
  <main id="main"></main>
</div>
<div id="modal" hidden><div class="box" id="mbox"></div></div>
<div id="toast" hidden></div>

<script>
/* ============ constants & helpers ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const ROLE={ph:'ص.',tech:'ف.ص.',dr:'د.ص.'};
const ROLE_NAME={ph:'صيدلي',tech:'فني صيدلي',dr:'دكتور صيدلي'};
const SCHED={we:{name:'خفارات نهاية الأسبوع والعطل الرسمية',short:'نهاية الأسبوع'},wd:{name:'خفارات أيام الأسبوع',short:'أيام الأسبوع'},ot:{name:'العمل الإضافي للفترة المسائية',short:'الإضافي'}};
const LEAVE={annual:'إجازة سنوية',sick:'إجازة مرضية',emergency:'إجازة طارئة',otx:'اعتذار عن الإضافي',off:'غير متاح'};
const uid=()=>Math.random().toString(36).slice(2,10);
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const dn=d=>{const[y,m,x]=d.split('-').map(Number);return Date.UTC(y,m-1,x)/864e5};
const dow=d=>new Date(dn(d)*864e5).getUTCDay();
function monthDays(key){const[y,m]=key.split('-').map(Number);const n=new Date(Date.UTC(y,m,0)).getUTCDate();return Array.from({length:n},(_,i)=>`${key}-${String(i+1).padStart(2,'0')}`)}
const mLabel=key=>{const[y,m]=key.split('-').map(Number);return `${MONTHS[m-1]} ${y}`};
const shiftMonth=(key,k)=>{const[y,m]=key.split('-').map(Number);const d=new Date(Date.UTC(y,m-1+k,1));return d.toISOString().slice(0,7)};
const dShort=d=>{const[,m,x]=d.split('-');return `${+m}/${+x}`};
const dFull=d=>`${DAYS[dow(d)]} ${dShort(d)}`;
function t12(t){let[h,mi]=t.split(':').map(Number);const suf=(h===0||h===24)?'فجراً':h<12?'صباحاً':h<16?'ظهراً':'مساءً';let hh=h%12;if(hh===0)hh=12;return `${String(hh).padStart(2,'0')}:${String(mi).padStart(2,'0')} ${suf}`}
const todayStr=()=>new Date().toISOString().slice(0,10);

const DEMO=true;
/* ============ state ============ */
const S={staff:[],config:null,leaves:[],prefs:[],months:{},month:null,sample:true,canEdit:true,tab:'dash',sub:'we',hl:'',dayPick:null,staffQ:'',staffRole:''};
const P={mode:'memory',db:null,q:{},unsub:{}};
const R=()=>S.config.rules;
const staffById=id=>S.staff.find(p=>p.id===id);
const slotById=id=>S.config.slots.find(s=>s.id===id);
const unitName=id=>(S.config.units.find(u=>u.id===id)||{}).name||id;
const pName=id=>{const p=staffById(id);return p?`${ROLE[p.role]} ${p.name}`:'(محذوف)'};
const slotLabel=sl=>`${unitName(sl.unit)} ${t12(sl.start)}–${t12(sl.end)}`;
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const slotHours=sl=>{let a=toMin(sl.start),b=toMin(sl.end);if(b<=a)b+=1440;return(b-a)/60};
const capOf=p=>p.maxHours||R().maxHours;
const fmtH=h=>Number.isInteger(h)?String(h):h.toFixed(1);
const curMonth=()=>S.months[S.month];

function defaultConfig(){
  const s=(id,sched,unit,start,end,ph,tech,days)=>({id,sched,unit,start,end,ph,tech,days});
  const WE=[5,6],WD=[0,1,2,3,4];
  return {
    units:[{id:'er',name:'صيدلية الحوادث'},{id:'int',name:'صيدلية الباطنية'},{id:'ped',name:'صيدلية الأطفال'},{id:'psy',name:'صيدلية النفيسي'},{id:'cli',name:'وحدة الكلينيكال'},{id:'cen',name:'الصيدلية المركزية'},{id:'end',name:'صيدلية الغدد'},{id:'der',name:'صيدلية الجلدية'}],
    slots:[
      s('we-er-n','we','er','00:00','07:00',3,1,WE), s('we-er-m','we','er','07:00','14:00',3,1,WE),
      s('we-er-a','we','er','14:00','21:00',3,1,WE), s('we-er-e','we','er','17:00','24:00',3,1,WE),
      s('we-int','we','int','07:00','14:00',1,1,WE), s('we-ped','we','ped','07:00','14:00',3,1,WE),
      s('we-psy','we','psy','07:00','14:00',1,1,[6]), s('we-cli','we','cli','07:00','14:00',1,0,WE),
      s('wd-er-a','wd','er','14:00','18:00',3,1,WD), s('wd-er-b','wd','er','17:00','21:00',3,1,WD),
      s('wd-er-c','wd','er','20:00','24:00',3,1,WD), s('wd-ped','wd','ped','14:00','18:00',3,0,[0,2,4]),
      s('wd-cli','wd','cli','14:00','18:00',2,0,WD),
      s('ot-cen','ot','cen','14:00','18:00',1,1,WD), s('ot-int','ot','int','14:00','18:00',3,1,WD),
      s('ot-ped','ot','ped','14:00','18:00',3,0,[1,3]), s('ot-psy','ot','psy','14:00','18:00',1,0,WD),
      s('ot-end','ot','end','14:00','18:00',1,1,[0,1,2,3]), s('ot-der','ot','der','14:00','18:00',1,1,WD)
    ],
    holidays:[],
    rules:{minGap:2,maxHours:32,countOt:false,maxOt:8,standby:2}
  };
}

/* Sample roster — invented names, clearly labelled as example data */
function sampleStaff(){
  const r=rng(7);

/* ============ engine ============ */
function slotsFor(d){
  const c=S.config;
  if(c.holidays.includes(d)) return c.slots.filter(s=>s.sched==='we'&&s.days.includes(5));
  const w=dow(d);
  return c.slots.filter(s=>s.days.includes(w)&&(w>=5?s.sched==='we':s.sched!=='we'));
}
const isWeekendDay=d=>S.config.holidays.includes(d)||dow(d)>=5;
function stOf(ix,p){return ix.st[p]||(ix.st[p]={duty:0,we:0,ot:0,total:0,hrs:0,otHrs:0,units:{},days:new Set(),dutyDays:new Set(),sbd:{}})}
function addIx(ix,a){const sl=slotById(a.s);if(!sl)return;(ix.byDate[a.d]||(ix.byDate[a.d]=[])).push(a);const s=stOf(ix,a.p),n=dn(a.d);s.total++;s.days.add(n);(s.sbd[n]||(s.sbd[n]=[])).push(sl);s.units[sl.unit]=(s.units[sl.unit]||0)+1;const h=slotHours(sl);if(sl.sched==='ot'){s.ot++;s.otHrs+=h}else{s.duty++;s.hrs+=h;s.dutyDays.add(n);if(sl.sched==='we')s.we++}}
function buildIx(asg){const ix={byDate:{},st:{}};for(const a of asg)addIx(ix,a);return ix}
function blocked(p,d,types){return S.leaves.some(l=>l.staffId===p&&d>=l.from&&d<=l.to&&types.includes(l.type))}
const roleOk=(p,role)=>role==='tech'?p.role==='tech':p.role!=='tech';
function whyNot(p,sl,d,ix,lv){
  if(!p.active)return'الموظف موقوف';
  if(!p.units.includes(sl.unit))return'غير مؤهل لهذه الوحدة';
  const lvx=S.leaves.find(l=>l.staffId===p.id&&d>=l.from&&d<=l.to&&['annual','sick','emergency','off'].includes(l.type));
  if(lvx)return LEAVE[lvx.type];
  if(sl.sched==='ot'&&!p.ot)return'لا يشارك في الإضافي';
  if(sl.sched==='ot'&&blocked(p.id,d,['otx']))return'معتذر عن الإضافي';
  const s=stOf(ix,p.id),n=dn(d);
  if(s.days.has(n))return'لديه مهمة أخرى في نفس اليوم';
  if(sl.start==='00:00'&&(s.sbd[n-1]||[]).some(x=>x.end==='24:00'))return'وردية الليلة السابقة تنتهي منتصف الليل';
  if(sl.end==='24:00'&&(s.sbd[n+1]||[]).some(x=>x.start==='00:00'))return'لديه وردية فجر في اليوم التالي';
  const h=slotHours(sl);
  if(sl.sched!=='ot'||R().countOt){const used=s.hrs+(R().countOt?s.otHrs:0);if(used+h>capOf(p))return`يتجاوز حد ${capOf(p)} ساعة (مستخدم ${fmtH(used)})`}
  if(sl.sched!=='ot'){for(let k=1;k<=lv.gap;k++)if(s.dutyDays.has(n-k)||s.dutyDays.has(n+k))return`أقل من ${lv.gap} يوم راحة عن خفارة أخرى`}
  else if(lv.caps&&s.ot>=R().maxOt)return`وصل حد الإضافي (${R().maxOt})`;
  return'';
}
function canTake(p,sl,d,ix,lv){return !whyNot(p,sl,d,ix,lv)}
function score(p,sl,ix,rand){const s=stOf(ix,p.id),u=s.units[sl.unit]||0;
  if(sl.sched==='ot')return s.ot*10+s.total*2+u*3+rand()*5;
  return s.hrs*2.2+(sl.sched==='we'?s.we*12:0)+u*3+s.total+rand()*5}
function levels(){const g=R().minGap;return[{gap:g,caps:true},{gap:Math.min(1,g),caps:true},{gap:0,caps:true},{gap:0,caps:false}]}
function candidates(sl,d,role,ix,rand,exclude){
  for(const lv of levels()){
    const list=S.staff.filter(p=>roleOk(p,role)&&!(exclude&&exclude.has(p.id))&&canTake(p,sl,d,ix,lv));
    if(list.length)return{list:list.map(p=>({p,sc:score(p,sl,ix,rand)})).sort((a,b)=>a.sc-b.sc),lv};
  }
  return{list:[],lv:null};
}
function generate(key,from){
  const m=S.months[key]||{};
  const seed=Math.floor(Math.random()*1e9),rand=rng(seed);
  const asg=from?(m.asg||[]).filter(a=>a.d<from):[];
  const ix=buildIx(asg);
  const days=monthDays(key).filter(d=>!from||d>=from);
  const pinReport=applyPins(key,days,asg,ix);
  for(const sched of['we','wd','ot'])for(const d of days)for(const sl of slotsFor(d)){
    if(sl.sched!==sched)continue;
    for(const role of['ph','tech'])for(let i=0;i<(sl[role]||0);i++){
      if(asg.filter(a=>a.d===d&&a.s===sl.id&&a.r===role).length>i)continue;
      const{list,lv}=candidates(sl,d,role,ix,rand);
      if(!list.length)continue;
      const a={id:uid(),d,s:sl.id,p:list[0].p.id,r:role};
      if(lv.gap<R().minGap||!lv.caps)a.w=1;
      asg.push(a);addIx(ix,a);
    }
  }
  const standby={};
  if(from&&m.standby)for(const k in m.standby)if(k<from)standby[k]=m.standby[k];
  for(const d of days){
    const ots=slotsFor(d).filter(s=>s.sched==='ot');if(!ots.length)continue;
    const pool=S.staff.filter(p=>ots.some(sl=>canTake(p,sl,d,ix,{gap:0,caps:false})))
      .map(p=>({p,sc:stOf(ix,p.id).ot*10+stOf(ix,p.id).total+rand()*4})).sort((a,b)=>a.sc-b.sc);
    standby[d]=pool.slice(0,R().standby).map(x=>x.p.id);
  }
  const log=[...(m.log||[]),{t:new Date().toISOString(),x:from?`إعادة توليد الجدول من ${dFull(from)}`:'توليد جدول الشهر'}].slice(-200);
  S.months[key]={seed,generatedAt:new Date().toISOString(),asg,standby,log,pinReport,pending:from?(m.pending||[]):[]};
}
/* Pinned requests: placed before the automatic fill, when rules allow */
function normPref(pr){
  if(pr.slot&&pr.unit===undefined){const sl=slotById(pr.slot);return Object.assign({},pr,sl?{unit:sl.unit,time:`${sl.sched}|${sl.start}-${sl.end}`}:{unit:'',time:''})}
  return pr;
}
const timeKey=sl=>`${sl.sched}|${sl.start}-${sl.end}`;
function timeLabel(k){if(!k)return'أي وقت';const[sc,r]=k.split('|');const[a,b]=r.split('-');return `${SCHED[sc].short} · ${t12(a)}–${t12(b)}`}
function prefSlots(pr,d){
  pr=normPref(pr);const p=staffById(pr.staffId);if(!p)return[];
  const role=p.role==='tech'?'tech':'ph';
  return slotsFor(d).filter(sl=>(!pr.unit||sl.unit===pr.unit)&&(!pr.time||timeKey(sl)===pr.time)&&(sl[role]||0)>0&&p.units.includes(sl.unit));
}
function prefDates(pr,key,days){
  if(pr.mode==='dates')return(pr.dates||[]).filter(d=>d.startsWith(key)&&days.includes(d));
  return days.filter(d=>(pr.weekdays||[]).includes(dow(d))&&prefSlots(pr,d).length);
}
function applyPins(key,days,asg,ix){
  const rep={},lv={gap:R().minGap,caps:true};
  const list=S.prefs.filter(pr=>staffById(pr.staffId));
  const place=(pr,d)=>{
    const p=staffById(pr.staffId),r=rep[pr.id],role=p.role==='tech'?'tech':'ph';
    const opts=prefSlots(pr,d);
    if(!opts.length)return r.miss.push({d,why:'لا توجد وردية مطابقة في هذا اليوم'});
    if(asg.some(a=>a.d===d&&a.p===p.id&&opts.some(o=>o.id===a.s))){r.ok++;return}
    const room=sl=>(sl[role]||0)-asg.filter(a=>a.d===d&&a.s===sl.id&&a.r===role).length;
    const open=opts.filter(sl=>room(sl)>0).sort((a,b)=>room(b)-room(a));
    if(!open.length)return r.miss.push({d,why:`الوردية مكتملة بطلبات أخرى (${role==='tech'?'الفنيون':'الصيادلة'})`});
    let why='';
    for(const sl of open){why=whyNot(p,sl,d,ix,lv);if(!why){const a={id:uid(),d,s:sl.id,p:p.id,r:role,f:'pin'};asg.push(a);addIx(ix,a);r.ok++;return}}
    r.miss.push({d,why});
  };
  for(const pr of list)rep[pr.id]={ok:0,miss:[],want:0};
  for(const pr of list.filter(x=>x.mode==='dates'))for(const d of prefDates(pr,key,days)){rep[pr.id].want++;place(pr,d)}
  const rec=list.filter(x=>x.mode!=='dates');
  for(const d of days){
    const today=rec.filter(pr=>prefDates(pr,key,[d]).length&&(!pr.max||rep[pr.id].ok<pr.max))
      .sort((a,b)=>stOf(ix,a.staffId).hrs-stOf(ix,b.staffId).hrs);
    for(const pr of today){rep[pr.id].want++;const before=rep[pr.id].miss.length;place(pr,d);
      const m=rep[pr.id].miss;if(m.length>before&&/راحة|مهمة أخرى|ساعة/.test(m[m.length-1].why)){m.pop();rep[pr.id].want--}}
  }
  return rep;
}
function addLog(m,x){(m.log||(m.log=[])).push({t:new Date().toISOString(),x});if(m.log.length>200)m.log=m.log.slice(-200)}

/* Vacate a person's assignments in a date range, find replacements, optionally compensate */
function vacate(staffId,from,to,scheds,compensate,reason){
  const m=curMonth();if(!m||!m.asg)return{rep:0,none:0,comp:0,pend:0};
  const res={rep:0,none:0,comp:0,pend:0};
  const hit=m.asg.filter(a=>a.p===staffId&&a.d>=from&&a.d<=to&&scheds.includes((slotById(a.s)||{}).sched)).sort((a,b)=>a.d<b.d?-1:1);
  if(m.standby)for(const k in m.standby)if(k>=from&&k<=to)m.standby[k]=m.standby[k].filter(x=>x!==staffId);
  const flat=()=>0.5;
  for(const a of hit){
    const sl=slotById(a.s);
    let ix=buildIx(m.asg.filter(x=>x!==a&&!(x.p===staffId&&x.d>=from&&x.d<=to)));
    let rep=null;
    if(sl.sched==='ot'){for(const id of(m.standby?.[a.d]||[])){const p=staffById(id);if(p&&roleOk(p,a.r)&&canTake(p,sl,a.d,ix,{gap:0,caps:false})){rep=p;break}}}
    if(!rep)rep=(candidates(sl,a.d,a.r,ix,flat,new Set([staffId])).list[0]||{}).p||null;
    if(rep){
      a.p=rep.id;a.f='rep';a.for=staffId;delete a.w;res.rep++;
      if(m.standby?.[a.d])m.standby[a.d]=m.standby[a.d].filter(x=>x!==rep.id);
      addLog(m,`${reason}: ${pName(rep.id)} بدلاً من ${pName(staffId)} — ${slotLabel(sl)} يوم ${dFull(a.d)}`);
    }else{
      m.asg.splice(m.asg.indexOf(a),1);res.none++;
      addLog(m,`${reason}: لا يوجد بديل متاح لـ ${pName(staffId)} — ${slotLabel(sl)} يوم ${dFull(a.d)} (شاغر)`);
    }
    if(compensate&&sl.sched!=='ot'){if(compensateOne(m,staffId,to,a,rep&&rep.id))res.comp++;else res.pend++}
  }
  return res;
}
function compensateOne(m,staffId,after,a,preferFrom){
  const sick=staffById(staffId);if(!sick)return false;
  const sched=(slotById(a.s)||{}).sched;
  const cnt=buildIx(m.asg);
  const fut=m.asg.filter(b=>b.d>after&&b.r===a.r&&b.p!==staffId&&(slotById(b.s)||{}).sched===sched&&b.f!=='comp'&&b.f!=='pin')
    .sort((x,y)=>(x.p===preferFrom?0:1)-(y.p===preferFrom?0:1)||stOf(cnt,y.p).duty-stOf(cnt,x.p).duty||(x.d<y.d?-1:1));
  for(const b of fut){
    const ix=buildIx(m.asg.filter(x=>x!==b));
    if(canTake(sick,slotById(b.s),b.d,ix,{gap:1,caps:false})){
      const prev=b.p;b.p=staffId;b.f='comp';b.for=prev;
      addLog(m,`تعويض: ${pName(staffId)} يأخذ خفارة ${pName(prev)} يوم ${dFull(b.d)} (${slotLabel(slotById(b.s))})`);
      return true;
    }
  }
  (m.pending||(m.pending=[])).push({id:uid(),p:staffId,d:a.d,s:a.s,r:a.r});
  addLog(m,`تعويض معلّق: لم يُعثر على خفارة مناسبة لتعويض ${pName(staffId)} عن ${dFull(a.d)}`);
  return false;
}

/* ============ persistence ============ */
function docBody(w){return w==='prefs'?{list:S.prefs}:w==='staff'?{list:S.staff}:w==='config'?S.config:w==='leaves'?{list:S.leaves}:S.months[S.month]}
function docPath(w){return w==='month'?'months/'+S.month:'app/'+w}
function save(...which){
  if(!S.canEdit){toast('لديك صلاحية عرض فقط');return}
  if(S.sample){S.sample=false;which=['staff','config','leaves','prefs','month']}
  for(const w of which){
    const path=docPath(w),body=docBody(w);if(!body)continue;
    const data=JSON.parse(JSON.stringify(body));
    if(P.mode==='db'){
      setStatus('saving');
      P.q[path]=(P.q[path]||Promise.resolve()).then(()=>P.db.doc(path).set(data)).then(()=>setStatus()).catch(e=>{
        const c=e&&e.code;
        if(c==='invalid_argument'){S.canEdit=false;toast('لم يُحفظ التعديل: حسابك يملك صلاحية العرض فقط');render()}
        else if(c==='quota_exceeded')toast('امتلأت مساحة التخزين. احذف جداول الأشهر القديمة ثم أعد المحاولة');
        else toast('تعذّر الحفظ بسبب الاتصال. أعد المحاولة بعد لحظات');
        setStatus();
      });
    }else if(P.mode==='local'){try{localStorage.setItem('munawib:'+path,JSON.stringify(data))}catch(e){}}
  }
  setStatus();renderBanner();
}
function setStatus(k){
  const el=$('#status');
  if(k==='saving'){el.className='status';el.textContent='جارٍ الحفظ…';return}
  if(S.sample){el.className='status sample';el.textContent='بيانات تجريبية';return}
  if(P.mode==='db'){el.className='status ok';el.textContent=S.canEdit?'محفوظ ومشترك':'عرض فقط';return}
  if(P.mode==='local'){el.className='status';el.textContent='محفوظ على هذا الجهاز';return}
  el.className='status';el.textContent='غير محفوظ';
}
function applyRemote(w,data){
  if(w==='staff')S.staff=data.list||[];
  else if(w==='config'){const d0=defaultConfig();S.config=Object.assign(d0,data,{rules:Object.assign(d0.rules,data.rules||{})});for(const u of S.config.units)if(u.name==='صيدلية النفسي')u.name='صيدلية النفيسي'}
  else if(w==='prefs')S.prefs=data.list||[];
  else if(w==='leaves')S.leaves=data.list||[];
  else S.months[S.month]=data;
}
function subscribeMonth(){
  if(P.mode!=='db')return;
  if(P.unsub.month)P.unsub.month();
  const key=S.month;
  P.unsub.month=P.db.doc('months/'+key).onSnapshot(snap=>{
    if(key!==S.month||snap.metadata.hasPendingWrites)return;
    if(snap.exists){S.months[key]=JSON.parse(JSON.stringify(snap.data()));}
    else if(!S.sample)delete S.months[key];
    render();
  },()=>{});
}
async function boot(){
  S.config=defaultConfig();S.month=shiftMonth(todayStr().slice(0,7),1);
  S.staff=sampleStaff();S.leaves=sampleLeaves(S.month);S.prefs=samplePrefs(S.month);generate(S.month);S.months[S.month].log=[{t:new Date().toISOString(),x:'جدول تجريبي مولَّد من بيانات أمثلة'}];
  try{S.tab=localStorage.getItem('munawib:tab')||S.tab}catch(e){}
  const h=location.hash.slice(1);if(['dash','sched','staff','leaves','prefs','settings'].includes(h))S.tab=h;
  render();
  if(!(window.claude&&window.claude.use)){loadLocal();return}
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){}
  if(user){try{S.canEdit=await user.canEdit()}catch(e){}}
  if(!db){loadLocal();return}
  P.mode='db';P.db=db;
  try{
    const[st,cf,lv,pf]=await Promise.all(['app/staff','app/config','app/leaves','app/prefs'].map(p=>db.doc(p).get()));
    if(st.exists){
      S.sample=false;S.months={};
      applyRemote('staff',JSON.parse(JSON.stringify(st.data())));
      if(cf.exists)applyRemote('config',JSON.parse(JSON.stringify(cf.data())));
      if(lv.exists)applyRemote('leaves',JSON.parse(JSON.stringify(lv.data())));
      S.prefs=[];if(pf.exists)applyRemote('prefs',JSON.parse(JSON.stringify(pf.data())));
    }
    for(const w of['staff','config','leaves','prefs']){
      P.unsub[w]=db.doc('app/'+w).onSnapshot(snap=>{if(snap.metadata.hasPendingWrites||!snap.exists)return;if(S.sample)return;applyRemote(w,JSON.parse(JSON.stringify(snap.data())));render()},()=>{});
    }
    if(!S.sample)subscribeMonth();
  }catch(e){toast('تعذّر تحميل البيانات المحفوظة')}
  render();
}
function loadLocal(){
  P.mode='local';
  if(DEMO){render();return}
  try{
    const g=p=>{const v=localStorage.getItem('munawib:'+p);return v?JSON.parse(v):null};
    const st=g('app/staff');

async function ensureMonth(){

function monthStats(){
  const m=curMonth();if(!m||!m.asg)return null;
  let need=0,filled=0;const vac=[];
  const by={};for(const a of m.asg)(by[a.d+'|'+a.s+'|'+a.r]=(by[a.d+'|'+a.s+'|'+a.r]||0)+1);
  for(const d of monthDays(S.month))for(const sl of slotsFor(d))for(const r of['ph','tech']){const n=sl[r]||0;if(!n)continue;const got=by[d+'|'+sl.id+'|'+r]||0;need+=n;filled+=Math.min(n,got);if(got<n)vac.push({d,sl,r,n:n-got})}
  const ix=buildIx(m.asg);
  return{need,filled,vac,ix,pin:m.asg.filter(a=>a.f==='pin').length,warn:m.asg.filter(a=>a.w).length,rep:m.asg.filter(a=>a.f==='rep').length,comp:m.asg.filter(a=>a.f==='comp').length};
}

function schedDays(sched){return monthDays(S.month).filter(d=>slotsFor(d).some(s=>s.sched===sched))}

function schedTable(sched,interactive){
  const m=curMonth(),cols=schedColumns(sched),days=schedDays(sched);
  const by={};for(const a of m.asg){(by[a.d+'|'+a.s]||(by[a.d+'|'+a.s]=[])).push(a)}
  const q=S.hl.trim();
  const hlIds=q?new Set(S.staff.filter(p=>p.name.includes(q)).map(p=>p.id)):null;
  let h=`<div class="tablewrap"><table class="sched"><thead><tr><th class="date" rowspan="2">التاريخ</th>${cols.map(c=>`<th colspan="${c.slots.length}">${esc(unitName(c.unit))}</th>`).join('')}${sched==='ot'?'<th rowspan="2">احتياط</th>':''}</tr><tr>${cols.map(c=>c.slots.map(s=>`<th class="num" style="font-weight:500;font-size:.78rem">${t12(s.start)}<br>${t12(s.end)}</th>`).join('')).join('')}</tr></thead><tbody>`;
  for(const d of days){
    const today=slotsFor(d).map(s=>s.id);

    h+=`<tr class="${cls}"><th class="date"><b>${DAYS[dow(d)]}</b><span>${dShort(d)}</span></th>`;

      const list=(by[d+'|'+sl.id]||[]).sort((a,b)=>(a.r==='tech')-(b.r==='tech'));
      let cell=list.map(a=>{const p=staffById(a.p);const c2=['nm',a.f||'',a.w?'w':'',hlIds&&hlIds.has(a.p)?'hl':''].join(' ');

        return interactive&&S.canEdit?`<button class="${c2}" data-act="asg" data-id="${a.id}" title="${a.f==='pin'?'مثبّت حسب رغبة الموظف':a.f==='rep'?'بديل عن '+esc(pName(a.for)):a.f==='comp'?'تعويض — كانت لـ '+esc(pName(a.for)):''}">${inner}</button>`:`<span class="${c2}">${inner}</span>`}).join('');
      for(const r of['ph','tech']){const miss=(sl[r]||0)-list.filter(a=>a.r===r).length;for(let i=0;i<miss;i++)cell+=interactive&&S.canEdit?`<button class="nm vac" data-act="fill" data-d="${d}" data-s="${sl.id}" data-r="${r}">شاغر · ${r==='tech'?'فني':'صيدلي'}</button>`:`<span class="nm vac">شاغر</span>`}
      h+=`<td>${cell}</td>`;
    }

    h+='</tr>';
  }
  return h+'</tbody></table></div>';
}

  <div><h3 style="margin-bottom:6px">استبدال يدوي</h3><p class="muted" style="margin:0 0 8px;font-size:.82rem">المتاحون في هذا اليوم مرتبون من الأقل حملاً${lv&&lv.gap<R().minGap?' — تنبيه: لا يوجد متاح مع احترام أيام الراحة':''}.</p>
  <div class="cand">${list.slice(0,25).map(c=>{const s=stOf(ix,c.p.id);return `<button data-pick="${c.p.id}"><b style="font-weight:500">${esc(pName(c.p.id))}</b><div class="spacer"></div><small>${fmtH(s.hrs)} من ${capOf(c.p)} ساعة · خفارات ${s.duty} · إضافي ${s.ot}</small></button>`}).join('')||'<div class="empty">لا يوجد موظف متاح</div>'}</div></div>
  <div class="actions"><button class="btn" id="amClose">إغلاق</button></div>`,b=>{
    $('#amClose',b).onclick=closeModal;
    $('#amView',b).onclick=()=>viewStaff(a.p);
    const pinB=$('#amPin',b);if(pinB)pinB.onclick=()=>{S.prefs.push({id:uid(),staffId:a.p,unit:sl.unit,time:timeKey(sl),mode:'dates',dates:[a.d],note:'تثبيت من الجدول'});a.f='pin';delete a.for;addLog(m,`تثبيت ${pName(a.p)} في ${slotLabel(sl)} يوم ${dFull(a.d)}`);closeModal();save('prefs','month');render();toast('ثُبّت الموظف، ولن يتغير عند إعادة التوليد')};
    $('#amDel',b).onclick=()=>{m.asg.splice(m.asg.indexOf(a),1);addLog(m,`إزالة ${pName(a.p)} من ${slotLabel(sl)} يوم ${dFull(a.d)}`);closeModal();save('month');render()};
    const mark=(type,comp)=>{S.leaves.push({id:uid(),staffId:a.p,type,from:a.d,to:a.d,note:'من الجدول'});const r=vacate(a.p,a.d,a.d,['we','wd','ot'],comp,LEAVE[type]);closeModal();save('leaves','month');render();toast(resultMsg(r))};
    $('#amSick',b).onclick=()=>mark('sick',true);
    $('#amEmg',b).onclick=()=>mark('emergency',false);
    b.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{const prev=a.p;a.p=x.dataset.pick;a.f='rep';a.for=prev;delete a.w;addLog(m,`استبدال يدوي: ${pName(a.p)} بدلاً من ${pName(prev)} — ${slotLabel(sl)} يوم ${dFull(a.d)}`);closeModal();save('month');render();toast('تم الاستبدال')});
  });
}
function fillModal(d,sid,r){
  const m=curMonth(),sl=slotById(sid),ix=buildIx(m.asg);
  const{list}=candidates(sl,d,r,ix,()=>0.5);
  openModal(`<h2>ملء مقعد شاغر</h2><div class="muted">${dFull(d)} · ${esc(slotLabel(sl))} · ${r==='tech'?'فني صيدلي':'صيدلي'}</div>
  <div class="cand">${list.slice(0,25).map(c=>{const s=stOf(ix,c.p.id);return `<button data-pick="${c.p.id}"><b style="font-weight:500">${esc(pName(c.p.id))}</b><div class="spacer"></div><small>${fmtH(s.hrs)} من ${capOf(c.p)} ساعة · إضافي ${s.ot}</small></button>`}).join('')||'<div class="empty">لا يوجد موظف متاح في هذا اليوم</div>'}</div><div class="actions"><button class="btn" id="fmClose">إغلاق</button></div>`,b=>{
    $('#fmClose',b).onclick=closeModal;
    b.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{m.asg.push({id:uid(),d,s:sid,p:x.dataset.pick,r,f:'rep'});addLog(m,`ملء شاغر: ${pName(x.dataset.pick)} — ${slotLabel(sl)} يوم ${dFull(d)}`);closeModal();save('month');render()});
  });
}
function genModal(){
  const m=curMonth(),days=monthDays(S.month);
  if(!m){doGen(null);return}
  const t=todayStr();const def=days.includes(t)?t:days[0];
  openModal(`<h2>إعادة توليد جدول ${mLabel(S.month)}</h2><p class="muted" style="margin:0">اختر من أي يوم يُعاد التوزيع. تبقى الأيام السابقة كما هي، ويُحسب ما فيها في عدالة التوزيع. مفيد عند إضافة موظف جديد أو تغيير الإعدادات في منتصف الشهر.</p>
  <label class="f">إعادة التوليد من<select id="gFrom">${days.map(d=>`<option value="${d}" ${d===def?'selected':''}>${dFull(d)}</option>`).join('')}</select></label>
  <div class="actions"><button class="btn primary" id="gGo">إعادة التوليد</button><button class="btn" id="gAll">إعادة الشهر كاملاً</button><button class="btn" id="gNo">إلغاء</button></div>`,b=>{
    $('#gNo',b).onclick=closeModal;
    $('#gGo',b).onclick=()=>{const f=$('#gFrom',b).value;closeModal();doGen(f===days[0]?null:f)};
    $('#gAll',b).onclick=()=>{closeModal();doGen(null)};
  });
}
function doGen(from){
  const t0=performance.now();generate(S.month,from);const ms=Math.round(performance.now()-t0);
  save('month');render();const st=monthStats();
  toast(`تم توليد الجدول في ${(ms/1000).toFixed(2)} ثانية · ${st.filled} من ${st.need} مقعد`);
}
function resultMsg(r){return `${r.rep} استبدال${r.none?` · ${r.none} بلا بديل`:''}${r.comp?` · ${r.comp} تعويض مجدول`:''}${r.pend?` · ${r.pend} تعويض معلّق`:''}`}
function bulkModal(){
  openModal(`<h2>إضافة قائمة موظفين</h2><p class="muted" style="margin:0">سطر لكل موظف: الاسم، الصفة، الوحدات (اختياري). الصفة: ص أو ف.ص أو د.ص. يمكنك نسخ عمودين أو ثلاثة من الإكسل ولصقها مباشرة.</p>
  <textarea id="bkT" placeholder="أحمد العنزي، ص، حوادث باطنية أطفال&#10;مريم الكندري، ف.ص&#10;حصة الشمري، د.ص، كلينيكال"></textarea>
  <div class="actions"><button class="btn primary" id="bkGo">إضافة</button><button class="btn" id="bkNo">إلغاء</button></div>`,b=>{
    $('#bkNo',b).onclick=closeModal;
    $('#bkGo',b).onclick=()=>{
      const kw={er:'حوادث',int:'باطن',ped:'أطفال',psy:'نفيس',cli:'كلين',cen:'مركز',end:'غدد',der:'جلد'};
      let n=0;
      for(const line of $('#bkT',b).value.split('\n')){
        const parts=line.split(/[\t,،]/).map(s=>s.trim()).filter(Boolean);if(!parts.length)continue;
        const rs=(parts[1]||'ص').replace(/\s/g,'');const role=rs.startsWith('ف')?'tech':rs.startsWith('د')?'dr':'ph';
        let units=Object.keys(kw).filter(k=>(parts[2]||'').includes(kw[k])).filter(k=>S.config.units.some(u=>u.id===k));
        if(!units.length)units=role==='dr'?['cli','er','int']:['er','int','cen'];
        S.staff.push({id:uid(),name:parts[0],role,units,ot:true,active:true,maxHours:null,phone:''});n++;
      }
      closeModal();if(n){save('staff');render();toast(`أُضيف ${n} موظف`)}
    };
  });
}

/* ============ export ============ */
function copyText(txt,msg){
  const ok=()=>toast(msg);
  try{navigator.clipboard.writeText(txt).then(ok,()=>fallback())}catch(e){fallback()}
  function fallback(){openModal(`<h2>انسخ النص</h2><textarea id="cpT" readonly>${esc(txt)}</textarea><div class="actions"><button class="btn" id="cpX">إغلاق</button></div>`,b=>{const t=$('#cpT',b);t.focus();t.select();$('#cpX',b).onclick=closeModal})}
}
function tsv(sched){
  const m=curMonth(),cols=schedColumns(sched),rows=[];
  rows.push(['التاريخ',...cols.flatMap(c=>c.slots.map(s=>`${unitName(c.unit)} ${t12(s.start)}-${t12(s.end)}`)),...(sched==='ot'?['احتياط']:[])]);
  for(const d of schedDays(sched)){const today=slotsFor(d).map(s=>s.id);
    rows.push([dFull(d),...cols.flatMap(c=>c.slots.map(sl=>today.includes(sl.id)?m.asg.filter(a=>a.d===d&&a.s===sl.id).map(a=>pName(a.p)).join('، '):'—')),...(sched==='ot'?[(m.standby[d]||[]).map(pName).join('، ')]:[])]);}
  return rows.map(r=>r.map(x=>String(x).replace(/\t|\n/g,' ')).join('\t')).join('\n');
}
async function dlHtml(){
  const body=schedTable(S.sub,false);
  const doc=`<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${SCHED[S.sub].name} ${mLabel(S.month)}</title><style>
  @page{size:A4 landscape;margin:10mm}body{font-family:Tahoma,Arial,sans-serif;font-size:10.5px;color:#000;margin:0}
  h1{text-align:center;font-size:15px;background:#e6e6e6;padding:6px;border:1px solid #999;margin:0 0 8px}
  table{border-collapse:collapse;width:100%}th,td{border:1px solid #555;padding:3px 5px;vertical-align:top;text-align:right}thead th{background:#e6e6e6;text-align:center}
  th.date{background:#eee;text-align:center}th.date b{display:block}.nm{display:block;white-space:nowrap}.pre{margin-left:3px}.vac{color:#a00}.na{text-align:center;color:#888}
  .sig{display:flex;justify-content:space-between;margin-top:18px;font-weight:bold}</style></head><body>
  <h1>${SCHED[S.sub].name} لشهر ${mLabel(S.month)}${S.sub==='ot'?' — من الساعة 2 ظهراً وحتى الساعة 6 مساءً':''}</h1>${body}
  <div class="sig"><span>رئيس قسم الصيدلة: ....................</span><span>رئيس الهيئة الطبية: ....................</span></div></body></html>`;
  const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
  if(!dl){copyText(tsv(S.sub),'التنزيل غير متاح هنا، نُسخ الجدول بدلاً منه للصقه في الإكسل');return}
  try{await dl.save({filename:`${S.sub==='we'?'weekend':S.sub==='wd'?'weekday':'overtime'}-${S.month}.html`,data:doc});toast('افتح الملف في المتصفح واطبعه أفقياً')}
  catch(e){if(e&&e.code!=='declined')toast('تعذّر التنزيل، استخدم «نسخ للإكسل»')}
}

/* ============ events ============ */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.tab=b.dataset.tab;try{localStorage.setItem('munawib:tab',S.tab)}catch(x){}render()});
$('#mPrev').onclick=async()=>{S.month=shiftMonth(S.month,-1);await ensureMonth();render()};
$('#mNext').onclick=async()=>{S.month=shiftMonth(S.month,1);await ensureMonth();render()};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='goto'){S.tab=b.dataset.tab;render()}
  else if(a==='gen')genModal();
  else if(a==='sub'){S.sub=b.dataset.sub;render()}
  else if(a==='asg')asgModal(id);
  else if(a==='fill')fillModal(b.dataset.d,b.dataset.s,b.dataset.r);
  else if(a==='copyTsv')copyText(tsv(S.sub),'نُسخ الجدول، الصقه في الإكسل');
  else if(a==='dlHtml')dlHtml();
  else if(a==='addStaff')staffForm(null);
  else if(a==='editStaff')staffForm(staffById(id));
  else if(a==='viewStaff')viewStaff(id);
  else if(a==='bulk')bulkModal();
  else if(a==='keepSample'){save('staff');toast('اعتُمدت البيانات التجريبية كبداية')}
  else if(a==='startEmpty')confirmBox('البدء من جديد','سيُحذف كل الموظفين والإجازات وجدول هذا الشهر، وتعود الإعدادات للافتراضي. لا يمكن التراجع.','مسح والبدء',()=>{
    S.staff=[];S.leaves=[];S.prefs=[];S.config=defaultConfig();S.months={};S.sample=false;save('staff','config','leaves','prefs');
    if(P.mode==='db')P.db.doc('months/'+S.month).delete().catch(()=>{});else if(P.mode==='local'){try{localStorage.removeItem('munawib:months/'+S.month)}catch(x){}}
    subscribeMonth();S.tab='staff';render();toast('ابدأ بإضافة الموظفين')},true);
  else if(a==='addLeave')addLeave();
  else if(a==='delLeave'){S.leaves=S.leaves.filter(l=>l.id!==id);save('leaves');render();toast('حُذفت الإجازة. الجدول لا يتغير تلقائياً')}
  else if(a==='retryComp'){const m=curMonth(),x=(m.pending||[]).find(p=>p.id===id);if(!x)return;m.pending=m.pending.filter(p=>p!==x);const ok=compensateOne(m,x.p,x.d,{s:x.s,r:x.r,d:x.d},null);if(ok)toast('جُدول التعويض');else{m.pending=m.pending.filter(p=>!(p.p===x.p&&p.d===x.d&&p!==x));m.pending.push(x);toast('لا توجد خفارة مناسبة بعد')}save('month');render()}
  else if(a==='dropComp'){const m=curMonth();m.pending=(m.pending||[]).filter(p=>p.id!==id);save('month');render()}
  else if(a==='addHol'){const d=$('#holDate').value;if(d&&!S.config.holidays.includes(d)){S.config.holidays.push(d);save('config');render();toast('أُضيفت العطلة. أعد توليد الجدول لتطبيقها')}}
  else if(a==='delHol'){S.config.holidays=S.config.holidays.filter(h=>h!==b.dataset.d);save('config');render()}
  else if(a==='addSlot'){const k=b.dataset.sched;S.config.slots.push({id:k+'-'+uid(),sched:k,unit:S.config.units[0].id,start:k==='we'?'07:00':'14:00',end:k==='we'?'14:00':'18:00',ph:1,tech:0,days:k==='we'?[5,6]:[0,1,2,3,4]});render()}
  else if(a==='delSlot'){S.config.slots=S.config.slots.filter(s=>s.id!==id);render()}
  else if(a==='addUnit'){S.config.units.push({id:'u'+uid(),name:'وحدة جديدة'});render()}
  else if(a==='saveSettings')saveSettings();
  else if(a==='pfAddDate'){const d=$('#pfDate').value;if(d){S._pfDates=[...new Set([...(S._pfDates||[]),d])].sort();prefUi()}}
  else if(a==='pfDelDate'){S._pfDates=(S._pfDates||[]).filter(x=>x!==b.dataset.d);prefUi()}
  else if(a==='addPref')addPref();
  else if(a==='delPref'){S.prefs=S.prefs.filter(p=>p.id!==id);save('prefs');render();toast('حُذف الطلب. يبقى الجدول الحالي كما هو حتى إعادة التوليد')}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='hlq'){S.hl=t.value;S._focusHl=true;render();S._focusHl=false}
  else if(t.id==='staffQ'){S.staffQ=t.value;render();const q=$('#staffQ');q.focus();q.setSelectionRange(q.value.length,q.value.length)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='dayPick'){S.dayPick=t.value;render()}
  else if(t.id==='pfUnit'||t.id==='pfTime'||t.name==='pfMode')prefUi();
  else if(t.id==='staffRole'){S.staffRole=t.value;render()}
  else if(t.dataset.slot){const sl=slotById(t.dataset.slot);if(!sl)return;const k=t.dataset.k;
    if(k==='day'){const w=+t.value;sl.days=t.checked?[...new Set([...sl.days,w])].sort():sl.days.filter(x=>x!==w)}
    else if(k==='ph'||k==='tech')sl[k]=Math.max(0,+t.value||0);
    else if(k==='start'||k==='end'){if(/^\d{2}:\d{2}$/.test(t.value))sl[k]=t.value;else{toast('اكتب الوقت بصيغة 14:00');t.value=sl[k]}}
    else sl[k]=t.value}
  else if(t.dataset.unit){const u=S.config.units.find(x=>x.id===t.dataset.unit);if(u)u.name=t.value.trim()||u.name}
});
function saveSettings(){
  const n=(id,min,max)=>Math.min(max,Math.max(min,+$(id).value||0));
  Object.assign(S.config.rules,{minGap:n('#rGap',0,6),maxHours:n('#rMaxH',1,200),countOt:$('#rCountOt').checked,maxOt:n('#rMaxO',0,31),standby:n('#rSb',0,10)});
  save('config');render();toast('حُفظت الإعدادات. أعد توليد الجدول لتطبيقها');
}
function addPref(){
  const name=$('#pfWho').value.trim(),p=S.staff.find(x=>x.name===name);
  if(!p){toast('اختر الموظف من القائمة المقترحة');return}
  const unit=$('#pfUnit').value,time=$('#pfTime').value,mode=document.querySelector('input[name=pfMode]:checked').value;
  if(unit&&!p.units.includes(unit)){toast(`${p.name} غير مؤهل لـ ${unitName(unit)}. عدّل وحداته من تبويب الموظفين أولاً`);return}
  const pr={id:uid(),staffId:p.id,unit,time,mode,note:$('#pfNote').value.trim()};
  const role=p.role==='tech'?'tech':'ph';
  if(!S.config.slots.some(sl=>(!unit||sl.unit===unit)&&(!time||timeKey(sl)===time)&&(sl[role]||0)>0&&p.units.includes(sl.unit))){toast('لا توجد وردية بهذا الوقت في هذه الصيدلية تناسب صفة الموظف');return}
  if(mode==='dates'){const ds=S._pfDates||[];if(!ds.length){toast('أضف يوماً واحداً على الأقل');return}
    const bad=ds.filter(d=>!prefSlots(pr,d).length);if(bad.length){toast(`لا توجد وردية مطابقة يوم ${bad.map(dFull).join('، ')}`);return}pr.dates=ds}
  else{pr.weekdays=[...document.querySelectorAll('.pfW:checked')].map(x=>+x.value);if(!pr.weekdays.length){toast('اختر يوماً من أيام الأسبوع');return}pr.max=+$('#pfMax').value||0}
  S.prefs.push(pr);S._pfDates=[];save('prefs');render();
  toast(curMonth()?'أُضيف الطلب. أعد توليد الجدول لتطبيقه':'أُضيف الطلب وسيُطبَّق عند التوليد');
}
function addLeave(){
  const name=$('#lvWho').value.trim(),p=S.staff.find(x=>x.name===name);
  if(!p){toast('اختر الموظف من القائمة المقترحة');return}
  const type=$('#lvType').value,from=$('#lvFrom').value,to=$('#lvTo').value;
  if(!from||!to||to<from){toast('تاريخ النهاية يجب أن يكون بعد تاريخ البداية');return}
  S.leaves.push({id:uid(),staffId:p.id,type,from,to,note:$('#lvNote').value.trim()});
  let msg=`سُجّلت ${LEAVE[type]} لـ ${p.name}`;
  if(curMonth()&&from<=S.month+'-31'&&to>=S.month+'-01'){
    const r=vacate(p.id,from,to,type==='otx'?['ot']:['we','wd','ot'],type==='sick'&&$('#lvComp').checked,LEAVE[type]);
    msg+=' · '+resultMsg(r);save('leaves','month');
  }else save('leaves');
  render();toast(msg);
}
boot();
</script>

</body></html>
